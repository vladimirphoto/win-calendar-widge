name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version from run number
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget
          path: dist/CalendarWidget.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CalendarWidget 1.0.${{ github.run_number }}
          files: dist/CalendarWidget.exe
      - name: Check RELEASES_TOKEN
        shell: bash
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::error::Секрет RELEASES_TOKEN не задан: обновления в виджет не попадут. Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
      # Публичная копия релиза для самообновления виджетов (нужен секрет RELEASES_TOKEN, см. README)
      - name: Publish to public releases repo
        uses: softprops/action-gh-release@v2
        with:
          repository: vladimirphoto/win-calendar-widget-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: latest
          name: CalendarWidget 1.0.${{ github.run_number }}
          files: dist/CalendarWidget.exe
