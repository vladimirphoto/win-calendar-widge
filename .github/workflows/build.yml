name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set version from run number
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget
          path: dist/CalendarWidget.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CalendarWidget 1.0.${{ github.run_number }}
          files: dist/CalendarWidget.exe
