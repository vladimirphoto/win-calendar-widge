name: Build exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: CalendarWidget
          path: dist/CalendarWidget.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CalendarWidget (latest)
          files: dist/CalendarWidget.exe
